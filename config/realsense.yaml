# Default RealSense L515 parameters passed to rs_launch.py
# Core sensor toggles
enable_color: true
enable_depth: true
enable_accel: true
enable_gyro: true

# IMU handling
unite_imu_method: 2        # 0=none, 1=copy, 2=linear interpolation
hold_back_imu_for_frames: false
angular_velocity_cov: 0.01
linear_accel_cov: 0.01

# Alignment & clipping
align_depth.enable: true
clip_distance: 5.0         # meters (set to 0.0 to disable)

# Depth module configuration
depth_module.min_distance: 0.25
depth_module.confidence_threshold: 1
depth_module.enable_max_usable_range: true
depth_module.noise_filtering: 2

# RGB configuration
rgb_camera.enable_auto_exposure: true
rgb_camera.enable_auto_white_balance: true

# Pointcloud output
pointcloud.enable: true
pointcloud.ordered_pc: false

# QoS & diagnostics
depth_qos: "SYSTEM_DEFAULT"
color_qos: "SYSTEM_DEFAULT"
pointcloud.pointcloud_qos: "SYSTEM_DEFAULT"
diagnostics_period: 0.0

# TF publishing
# publish_tf: true
# publish_odom_tf: true
# tf_publish_rate: 1.0
